apiVersion: v1
kind: Service
metadata:
  name: java-app-service
spec:
  type: LoadBalancer   
  selector:
    app: java-app
  ports:
    - port: 80          
      targetPort: 8080  
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
